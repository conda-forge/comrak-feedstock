context:
  version: "0.59.0"

package:
  name: comrak
  version: ${{ version }}

source:
  url: https://github.com/kivikakk/comrak/archive/refs/tags/v${{ version }}.tar.gz
  sha256: 74dfb6edda9b94b557685382162844ec9902cea3f10281585035c7a51d04fcfc

build:
  number: 0
  script:
    env:
      CARGO_PROFILE_RELEASE_LTO: fat
      CARGO_PROFILE_RELEASE_STRIP: symbols
    interpreter: nu
    content:
      - let prefix = $env.LIBRARY_PREFIX? | default $env.PREFIX
      - cargo auditable install --path=. --root=($prefix) --no-track --locked --bins
      - cargo-bundle-licenses --format=yaml --output=THIRDPARTY.yml

requirements:
  build:
    - ${{ stdlib('c') }}
    - ${{ compiler('c') }}
    - ${{ compiler('rust') }}
    - cargo-auditable
    - cargo-bundle-licenses
    - nushell

tests:
  - script:
      - comrak --help
      - comrak --version
  - package_contents:
      bin:
        - comrak
      strict: true

about:
  summary: A 100% CommonMark-compatible GitHub Flavored Markdown parser and renderer
  description: |
    Comrak is a CommonMark and GitHub Flavored Markdown compatible parser and
    renderer, written in Rust. It converts Markdown to HTML, XML and CommonMark,
    with various optional features like syntax highlighting, source position attributes,
    header ID prefixes and many more thanks to a flexible extension system.
  license: BSD-2-Clause
  license_file:
    - COPYING
    - THIRDPARTY.yml
  homepage: https://comrak.ee/
  repository: https://github.com/kivikakk/comrak

extra:
  recipe-maintainers:
    - salim-b
